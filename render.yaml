services:
  - type: web
    name: ai-review-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_CELERY
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: ai-review-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: ai-review-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEYS
        sync: false

  - type: worker
    name: ai-review-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app.celery worker -l info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_CELERY
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: ai-review-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: ai-review-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEYS
        sync: false

  - type: redis
    name: ai-review-redis
    ipAllowList: []
