name: Quality Gate

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  i18n-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: i18n gate
        run: npm run check:i18n

      - name: Frontend build
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Core grading tests
        # Keep explicit file list to focus on core grading regression gate.
        run: python -m pytest -q tests/test_core_flows.py tests/test_output_schema_and_defaults.py tests/test_multi_doc.py tests/test_version_management.py
